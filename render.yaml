services:
  - type: web
    name: recode-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: RECODE_REQUIRE_AUTH
        value: "true"
      - key: RECODE_SEED_DEMO_DATA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: RECODE_AUTH_PASSWORD
        sync: false
      - key: RECODE_SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OLLAMA_MODEL
        value: gemma3:4b
